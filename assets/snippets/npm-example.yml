name: Node.js CI
on: # Évènements déclencheurs
  - push:
      branch: main # Lorsqu'un nouveau commit est poussé sur la branche "main"
  - schedule:
    - cron: "*/15 * * * *" # Toutes les 15 minutes
jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
    - run: npm run test
  test-mac:
    runs-on: macos-12
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
    - run: npm run test
